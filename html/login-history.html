

<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Admin Login History</title>
  <link rel="stylesheet" href="../css/dashboard.css" />
  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-app.js";
    import { getFirestore, collection, query, where, orderBy, getDocs } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-firestore.js";
    import { getAuth, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/10.11.0/firebase-auth.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA-BlIka2Omcmxmt2NDVTpl3dlBX3_4pDk",
      authDomain: "logicalfetch-138a8.firebaseapp.com",
      projectId: "logicalfetch-138a8",
      storageBucket: "logicalfetch-138a8.appspot.com",
      messagingSenderId: "352479441148",
      appId: "1:352479441148:web:1c57797bdadb3fe906a779",
      measurementId: "G-Z66R8XS5SW"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const auth = getAuth(app);

    const loginTable = document.getElementById("loginHistoryTable");

    onAuthStateChanged(auth, async (user) => {
      if (!user) {
        window.location.href = "admin-login.html";
        return;
      }

      const q = query(collection(db, "adminLogs"), where("action", "==", "logged in"), orderBy("timestamp", "desc"));
      const snap = await getDocs(q);

      loginTable.innerHTML = "";

      snap.forEach((doc) => {
        const log = doc.data();
        const row = document.createElement("tr");
        row.innerHTML = `
          <td>${log.admin}</td>
          <td>${new Date(log.timestamp).toLocaleString()}</td>
        `;
        loginTable.appendChild(row);
      });
    });
  </script>
</head>
<body>
  <main class="dashboard-content" style="padding: 20px;">
    <h2>Admin Login History</h2>
    <table border="1" cellpadding="10" style="width: 100%; background: #fff;">
      <thead>
        <tr>
          <th>Admin Email</th>
          <th>Login Time</th>
        </tr>
      </thead>
      <tbody id="loginHistoryTable">
        <tr><td colspan="2">Loading login history...</td></tr>
      </tbody>
    </table>
  </main>
</body>
</html>
