<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Upload Demo Projects - LogicalFetch</title>
  <style>
    body {
      font-family: sans-serif;
      background: #f0f2f5;
      margin: 0;
      padding: 0;
      display: flex;
      flex-direction: column;
      align-items: center;
    }
    h1 {
      margin-top: 2rem;
    }
    form {
      background: white;
      padding: 2rem;
      margin-top: 1rem;
      border-radius: 8px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.1);
      display: flex;
      flex-direction: column;
      gap: 1rem;
      width: 100%;
      max-width: 400px;
    }
    input, textarea, button {
      padding: 0.75rem;
      font-size: 1rem;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      background: #4a4aff;
      color: white;
      border: none;
      cursor: pointer;
    }
    .gallery {
      margin-top: 2rem;
      display: flex;
      gap: 1rem;
      flex-wrap: wrap;
      justify-content: center;
    }
    .card {
      background: white;
      padding: 1rem;
      border-radius: 8px;
      width: 200px;
      text-align: center;
      box-shadow: 0 1px 4px rgba(0,0,0,0.1);
    }
    .card img {
      width: 100%;
      height: 120px;
      object-fit: cover;
      border-radius: 4px;
    }
  </style>
</head>
<body>
  <h1>Upload Demo Projects</h1>
  <form id="demoForm">
    <input type="text" id="title" placeholder="Project Title" required />
    <textarea id="description" placeholder="Project Description (optional)"></textarea>
    <input type="file" id="imageFile" accept="image/*" required />
    <button type="submit">Upload Demo</button>
  </form>

  <section class="gallery" id="gallery"></section>

  <script type="module">
    import { initializeApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
    import { getFirestore, collection, addDoc, getDocs, query, orderBy, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-firestore.js";
    import { getStorage, ref, uploadBytes, getDownloadURL } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-storage.js";

    const firebaseConfig = {
      apiKey: "AIzaSyA-BlIka2Omcmxmt2NDVTpl3dlBX3_4pDk",
      authDomain: "logicalfetch-138a8.firebaseapp.com",
      projectId: "logicalfetch-138a8",
      storageBucket: "logicalfetch-138a8.appspot.com",
      messagingSenderId: "352479441148",
      appId: "1:352479441148:web:1c57797bdadb3fe906a779"
    };

    const app = initializeApp(firebaseConfig);
    const db = getFirestore(app);
    const storage = getStorage(app);

    const form = document.getElementById('demoForm');
    const gallery = document.getElementById('gallery');

    form.addEventListener('submit', async e => {
      e.preventDefault();
      try {
        const title = document.getElementById('title').value.trim();
        const description = document.getElementById('description').value.trim();
        const file = document.getElementById('imageFile').files[0];

        if (!title || !file) return alert('Please enter title and choose an image.');

        const fileRef = ref(storage, `demoImages/${Date.now()}_${file.name}`);
        await uploadBytes(fileRef, file);
        const url = await getDownloadURL(fileRef);

        await addDoc(collection(db, "demos"), {
          title,
          description,
          image: url,
          timestamp: serverTimestamp()
        });

        form.reset();
        loadDemos();
      } catch (error) {
        console.error("Upload failed:", error);
        alert("Error uploading demo. See console for details.");
      }
    });

    async function loadDemos() {
      gallery.innerHTML = '';
      const q = query(collection(db, "demos"), orderBy("timestamp", "desc"));
      const querySnapshot = await getDocs(q);
      querySnapshot.forEach(doc => {
        const d = doc.data();
        const card = document.createElement('div');
        card.className = 'card';
        card.innerHTML = `
          <img src="${d.image}" alt="${d.title}" />
          <h4>${d.title}</h4>
          <p style="font-size: 0.9rem;">${d.description || ''}</p>
        `;
        gallery.appendChild(card);
      });
    }

    loadDemos();
  </script>
</body>
</html>
